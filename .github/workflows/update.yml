name: Update rates

# NOTE: this has no `schedule:` trigger. GitHub-hosted runners (ubuntu-latest)
# get a hard 403 from synergy.net.au -- it sits behind Azure Front Door, and
# its WAF blocks the datacenter/hosting IP ranges GitHub Actions runs on
# (confirmed: identical request, identical User-Agent, succeeds from an
# ordinary home connection and fails only from the runner). The actual
# weekly scrape runs from a home machine via a plain cron/launchd job --
# see deploy/. This workflow is kept for `workflow_dispatch` convenience
# only, and will likely also 403 unless run from a self-hosted runner.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape current rates
        run: python3 scripts/scrape.py

      - name: Check for changes
        id: diff
        run: |
          git show HEAD:data/plans.json > /tmp/old_plans.json 2>/dev/null || echo '{"plans":[]}' > /tmp/old_plans.json
          if git diff --quiet -- data/plans.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=$(python3 scripts/diff_summary.py /tmp/old_plans.json data/plans.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plans.json
          git commit -m "Update rates: ${{ steps.diff.outputs.summary }}"
          git push
